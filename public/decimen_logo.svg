<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#0088ff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0044aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#070a11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0033aa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#070a11"/>
  
  <!-- Outer Glow and Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00d8ff" stroke-width="4" stroke-opacity="0.7"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Optical Aperture Blades -->
  <g fill="none" stroke="#00d8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 256 100 Q 340 140 370 210" />
    <path d="M 370 210 Q 390 300 340 370" />
    <path d="M 340 370 Q 260 410 190 370" />
    <path d="M 190 370 Q 120 310 130 220" />
    <path d="M 130 220 Q 180 130 256 100" />
  </g>

  <!-- Central Core Optical Ring -->
  <circle cx="256" cy="256" r="65" fill="#070a11" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="256" cy="256" r="45" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="25" fill="#00f0ff"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Photon Light Ray Beam -->
  <path d="M 90 90 L 422 422" stroke="url(#beam)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="90" cy="90" r="14" fill="#ffffff" filter="drop-shadow(0 0 8px #00f0ff)"/>
  <circle cx="422" cy="422" r="10" fill="#00f0ff" opacity="0.8"/>
  <line x1="210" y1="210" x2="302" y2="302" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
